<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f7d9df">
<meta name="description" content="CozyPet 3.0 - Cozy World virtual pet game">
<title>CozyPet 3.0 — Cozy World</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast"></div>

<header class="topbar">
  <div class="brand"><span class="logo">🐾</span><div><b>CozyPet</b><small>Cozy World 3.0</small></div></div>
  <div class="wallet"><span>🪙 <b id="coins">0</b></span><span>💎 <b id="gems">0</b></span></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Pengaturan">⚙️</button>
</header>

<main>
  <section class="hero-card">
    <div class="pet-scene" id="petScene">
      <div class="weather" id="weather">☀️</div>
      <div class="pet" id="pet">🐰</div>
      <div class="pet-shadow"></div>
      <div class="speech" id="speech">Hai! 🥰</div>
      <div class="pet-name" id="petName">Mochi</div>
    </div>
    <div class="status-panel">
      <div class="level-line"><span>Level <b id="level">1</b></span><span id="mood">😊 Happy</span></div>
      <div class="xp"><i id="xpBar"></i></div>
      <div class="stats">
        <div><span>🍗</span><label>Hunger</label><b id="hunger">80</b></div>
        <div><span>💗</span><label>Happy</label><b id="happy">80</b></div>
        <div><span>⚡</span><label>Energy</label><b id="energy">80</b></div>
        <div><span>🫧</span><label>Clean</label><b id="clean">80</b></div>
        <div><span>❤️</span><label>Health</label><b id="health">100</b></div>
      </div>
      <div class="actions">
        <button data-action="feed">🍓 Feed</button>
        <button data-action="play">🎾 Play</button>
        <button data-action="bath">🫧 Bath</button>
        <button data-action="sleep">🌙 Sleep</button>
      </div>
    </div>
  </section>

  <section class="location-card">
    <div class="section-head"><div><span class="eyebrow">EXPLORE</span><h2>Cozy World</h2></div><span id="timeLabel">☀️ Day</span></div>
    <div class="locations">
      <button class="location active" data-location="home">🏠<b>Home</b><small>Istirahat</small></button>
      <button class="location" data-location="garden">🌷<b>Garden</b><small>Tanam & panen</small></button>
      <button class="location" data-location="cafe">☕<b>Cozy Café</b><small>Makanan</small></button>
      <button class="location" data-location="shop">🛍️<b>Town Shop</b><small>Belanja</small></button>
      <button class="location" data-location="park">🎡<b>Fun Park</b><small>Mini game</small></button>
    </div>
  </section>

  <section class="content-grid">
    <div class="panel" id="worldPanel"></div>
    <aside class="panel side-panel">
      <div class="section-head"><div><span class="eyebrow">TODAY</span><h2>Cozy Tasks</h2></div></div>
      <div id="quests"></div>
      <div class="streak"><span>🔥</span><div><b id="streak">1 day streak</b><small>Rawat pet setiap hari</small></div></div>
      <button class="wide-btn" id="rewardBtn">🎁 Daily Reward</button>
    </aside>
  </section>

  <section class="panel collection-panel">
    <div class="section-head"><div><span class="eyebrow">COLLECTION</span><h2>Cozy Collection</h2></div><span id="collectionCount">1 / 6 pets</span></div>
    <div class="pet-collection" id="petCollection"></div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
